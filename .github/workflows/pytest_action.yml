name: Testing with Pytest

on:
  push:
    branches: [ main, featurea ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.10]   # ← your small “exploration” upgrade

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest and create report
        run: pytest --junitxml=pytest-report.xml

      - name: Upload Pytest report
        uses: actions/upload-artifact@v2
        with:
          name: pytest-results
          path: pytest-report.xml

      - if: success()
        run: echo "✅ Pytest passed successfully!"
      - if: failure()
        run: echo "❌ Pytest failed!"
